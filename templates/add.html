<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Reservation</title>
</head>
<body>
    <h1>Add a New Reservation</h1>
    <form method="post">
        <label for="reservation_id">Reservation ID:</label>
        <input type="number" id="reservation_id" name="reservation_id" required><br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required><br>
        <label for="time">Time:</label>
        <input type="time" id="time" name="time" required><br>
        <label for="customer_id">Customer ID:</label>
        <input type="number" id="customer_id" name="customer_id" required><br>
        <label for="table_id">Table ID:</label>
        <input type="number" id="table_id" name="table_id" required><br>
        <label for="employee_id">Employee ID:</label>
        <input type="number" id="employee_id" name="employee_id" required><br>
        <button type="submit">Add Reservation</button>
    </form>
    <a href="/">Back to Reservation List</a>
</body>
</html>
